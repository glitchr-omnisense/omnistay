# omnisense/omnistay with every omnistay/* provider:
#
#   docker compose run --rm omnistay test       # every package's tests (recorded answers, no network)
#   docker compose run --rm omnistay bare       # plain PHP: a registry, a search over two providers, a booking - and what PHP loaded
#   docker compose run --rm omnistay phpstan    # PHPStan, each package at the highest level
#   docker compose down -v                      # the harness's volume gone
#
# Providers come from GitHub (branch 1.x) unless their checkout sits under OMNISTAY_PLUGINS (set it
# to ../.. in .env when this core sits in the workspace beside them): then that checkout is what runs.
name: omnistay-harness

services:
  omnistay:
    build: .
    image: omnisense/omnistay-harness
    # The image may be another family's harness tagged (the same PHP 8.4 Alpine with Composer): the
    # entrypoint is named here, not taken from the image.
    entrypoint: ["/omnistay/core/docker/entrypoint.sh"]
    # One service, no server beside it: Docker's default bridge, no network of its own to create.
    network_mode: bridge
    env_file:
      - path: .env
        required: false
    volumes:
      - ..:/omnistay/core
      - ${OMNISTAY_PLUGINS:-./plugins}:/omnistay/plugins:ro
      - harness:/harness

volumes:
  harness:
